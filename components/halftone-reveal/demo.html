<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HalftoneReveal demo — LZY.Comp</title>
<link rel="stylesheet" href="halftone-reveal.css">
<style>
  body { margin: 0; background: #0f0820; color: #f5e8ff; font-family: "Noto Sans SC", system-ui, sans-serif; }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 48px 24px 80px; }
  h1 { font-size: 22px; margin: 0 0 8px; }
  p.tip { color: #a895b3; font-size: 13px; margin: 0 0 32px; }
  .row { display: flex; flex-wrap: wrap; gap: 28px; }
  .cell { display: flex; flex-direction: column; gap: 10px; }
  .stage { width: 520px; max-width: 92vw; height: 420px; }
  .cell figcaption { color: #a895b3; font-size: 12px; font-family: "JetBrains Mono", monospace; }
</style>
</head>
<body>
<div class="wrap">
  <h1>HalftoneReveal · 网点显影</h1>
  <p class="tip">悬停划过 → 半调网点显影成真实照片；点击 → burst 扩散环；离开后 1.2s 回落为印刷层</p>
  <div class="row">
    <figure class="cell">
      <div id="ht-mono" class="stage"></div>
      <figcaption>mode=mono · ink=#00d9ff · cellSize=6 · angle=45</figcaption>
    </figure>
    <figure class="cell">
      <div id="ht-duo" class="stage"></div>
      <figcaption>mode=duotone · ink=#00d9ff + accent=#9e59ee（+30° 网屏）</figcaption>
    </figure>
  </div>
</div>

<script src="halftone-reveal.js"></script>
<script>
(function () {
  'use strict';
  var enc = encodeURIComponent;
  var ASSET = '../../assets/';

  window.LZY.Comp.HalftoneReveal.init(document.getElementById('ht-mono'), {
    src: ASSET + enc('2024扬州大学智能视觉比赛现场.jpg'),
    mode: 'mono',
    shape: 'dot',
    cellSize: 6,
    angle: 45,
    inkColor: '#00d9ff',
    paperColor: '#0f0820',
    revealRadius: 160,
    linger: 1.2
  });

  window.LZY.Comp.HalftoneReveal.init(document.getElementById('ht-duo'), {
    src: ASSET + enc('liuzhiyuan.jpg'),
    mode: 'duotone',
    shape: 'dot',
    cellSize: 7,
    angle: 45,
    inkColor: '#00d9ff',
    accentColor: '#9e59ee',
    paperColor: '#0f0820',
    revealRadius: 150,
    linger: 1.2
  });
})();
</script>
</body>
</html>
