<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orb 能量光环 · 组件演示</title>
<link rel="stylesheet" href="orb.css">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #0f0820;
    color: #f5e8ff;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  .stack { display: flex; flex-direction: column; gap: 16px; padding: 20px 24px; max-width: 1100px; margin: 0 auto; }
  h1 { font-size: 15px; font-weight: 500; letter-spacing: 0.2em; color: #a895b3; margin: 4px 0 0; }
  .hint { font-size: 12px; color: #a895b3; letter-spacing: 0.08em; margin: 0 0 4px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 268px 268px; gap: 16px; }
  .panel {
    position: relative;
    height: 268px;
    border: 1px solid rgba(120, 40, 214, 0.28);
    border-radius: 14px;
    overflow: hidden;
    background: #0f0820;
  }
  .panel--tall { grid-row: span 2; height: 100%; }
  .tag {
    position: absolute; top: 14px; left: 16px; z-index: 2;
    font-size: 12px; letter-spacing: 0.14em; color: #a895b3;
    pointer-events: none;
  }
</style>
</head>
<body>
<div class="stack">
  <div>
    <h1>ORB · 能量光环（原生 WebGL2 移植）</h1>
    <p class="hint">指针悬停 / 点击面板可触发 followCursor 与 clickPulse</p>
  </div>

  <div class="grid">
    <div class="panel panel--tall">
      <span class="tag">V1 · 默认参数（紫 #7828d6 / 青 #00d9ff / 橙 #ff6b35，底 #0f0820）</span>
      <div id="orb-1" style="position:absolute; inset:0;"></div>
    </div>

    <div class="panel">
      <span class="tag">V2 · tiltX 28 · glow 1.6 · wobble 1.8 · highlight 1.3</span>
      <div id="orb-2" style="position:absolute; inset:0;"></div>
    </div>

    <div class="panel">
      <span class="tag">V3 · 紧环 bleed 0.45 · followCursor:false · speed 0.6 · highlight 1.6</span>
      <div id="orb-3" style="position:absolute; inset:0;"></div>
    </div>
  </div>
</div>

<script src="orb.js"></script>
<script>
  window.__orbInstances = [
    LZY.Comp.Orb.init(document.getElementById('orb-1')),
    LZY.Comp.Orb.init(document.getElementById('orb-2'), {
      tiltX: 28, glow: 1.6, wobble: 1.8, highlight: 1.3, hoverIntensity: 1.4
    }),
    LZY.Comp.Orb.init(document.getElementById('orb-3'), {
      bleed: 0.45, followCursor: false, speed: 0.6, trail: 0.6, glow: 1.2, highlight: 1.6
    })
  ];
</script>
</body>
</html>
