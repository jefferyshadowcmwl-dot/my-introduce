server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 中文文件名与 UTF-8 内容正确显示
    charset utf-8;

    # 静态资源缓存（简历证书照片等，更新频率低）
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
